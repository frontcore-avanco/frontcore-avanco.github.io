<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<script>
  // Portão simples: se essa aba não passou pelo login, volta pro início.
  // É só uma barreira de navegação (site estático, sem servidor) — não
  // protege nada de quem souber contorná-la.
  if (!sessionStorage.getItem("frontcore_token")) location.replace("../");
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrontCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/help-widget.css">
<link rel="stylesheet" href="../assets/dados-paineis.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<header class="topo">
  <button class="btn-menu" id="btn-menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="lateral"></button>
  <a class="logo-link" href="./" id="logo-topo" aria-label="FrontCore — início"></a>
  <p class="tagline">Ferramentas e conhecimento<br>do suporte, em um só lugar.</p>

  <div class="busca-global" id="busca-global">
    <span class="busca-icone" id="busca-icone"></span>
    <input type="text" id="busca-input" placeholder="Buscar ferramenta, manual ou assunto..." autocomplete="off" spellcheck="false" aria-label="Buscar ferramenta, manual ou assunto" aria-controls="busca-resultados" aria-expanded="false" role="combobox">
    <kbd>Ctrl + K</kbd>
    <div class="busca-resultados" id="busca-resultados" role="listbox" hidden></div>
  </div>

  <div class="status-topo" title="Plataforma no ar">
    <span class="ponto"></span>
    <div class="status-texto"><strong>Sistema online</strong><span id="relogio">--/--/---- --:--</span></div>
  </div>

  <div class="menu-sino">
    <button class="btn-icone" id="btn-sino" type="button" aria-label="Notificações" aria-expanded="false"></button>
    <div class="popover" id="pop-sino" hidden>Sem notificações no momento.</div>
  </div>

  <div class="menu-usuario">
    <button class="btn-usuario" id="btn-usuario" type="button" aria-expanded="false" aria-haspopup="true">
      <span class="avatar" id="avatar">?</span>
      <span class="usuario-texto"><strong id="usuario-nome">Usuário</strong><span>Suporte</span></span>
      <span id="usuario-seta"></span>
    </button>
    <div class="popover popover-usuario" id="pop-usuario" hidden>
      <p class="pop-nome" id="pop-nome"></p>
      <p class="pop-email" id="pop-email"></p>
      <a class="pop-sair" id="link-sair" href="../"><span id="sair-icone"></span>Sair</a>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="lateral" id="lateral" aria-label="Menu principal"></nav>

  <main class="principal" id="principal">
    <section class="hero" id="hero"></section>

    <section class="bloco">
      <div class="bloco-topo">
        <h2 class="bloco-titulo"><span id="icone-ferramentas"></span>Ferramentas</h2>
        <div class="filtros" id="filtros" role="group" aria-label="Filtrar ferramentas">
          <button type="button" class="chip ativo" data-filtro="todos">Todos</button>
          <button type="button" class="chip" data-filtro="disponivel">Disponíveis</button>
          <button type="button" class="chip" data-filtro="beta">Beta</button>
          <button type="button" class="chip" data-filtro="breve">Em breve</button>
        </div>
        <label class="busca-ferramenta"><span id="icone-busca-ferramenta"></span>
          <input type="search" id="filtro-texto" placeholder="Buscar ferramenta..." autocomplete="off" aria-label="Buscar ferramenta">
        </label>
      </div>
      <div class="grade" id="grade-ferramentas"></div>
      <p class="vazio" id="vazio-ferramentas" hidden>Nenhuma ferramenta encontrada para esse filtro.</p>
    </section>

    <section class="bloco">
      <div class="bloco-topo">
        <h2 class="bloco-titulo"><span id="icone-recursos"></span>Recursos</h2>
      </div>
      <div class="grade" id="grade-recursos"></div>
    </section>
  </main>

  <aside class="direita" id="direita"></aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<script type="module" src="home.js"></script>
<script type="module" src="../assets/js/help-widget.js"></script>
</body>
</html>
