<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="auth-card">
  <span class="auth-eyebrow">Avanço · Plataforma</span>
  <p class="auth-brand">FrontCore</p>

  <!-- ==================== TELA 1: LOGIN ==================== -->
  <div class="auth-view" id="view-login">
    <h2>Entrar</h2>
    <form id="form-login">
      <p class="error-msg" id="login-error" hidden></p>
      <div class="field-group">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field-group">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </div>

  <!-- ==================== TELA 2: TROCAR SENHA ==================== -->
  <div class="auth-view" id="view-newpass" hidden>
    <h2>Defina uma nova senha</h2>
    <p class="hint">Primeiro acesso — troque a senha inicial por uma sua. Ela fica salva só neste navegador: em outro computador ou navegador, vale de novo a senha inicial.</p>
    <form id="form-newpass">
      <p class="error-msg" id="newpass-error" hidden></p>
      <div class="field-group">
        <label for="nova-senha">Nova senha</label>
        <input type="password" id="nova-senha" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field-group">
        <label for="confirma-senha">Confirmar nova senha</label>
        <input type="password" id="confirma-senha" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn-primary">Salvar nova senha</button>
    </form>
  </div>

  <!-- ==================== TELA 3: CONCLUÍDO ==================== -->
  <div class="auth-view" id="view-done" hidden>
    <div class="success-icon">✅</div>
    <h2>Login confirmado</h2>
    <p class="hint">Entrando...</p>
    <p class="back-home"><a href="home/">Entrar no FrontCore →</a></p>
  </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
